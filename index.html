<!-- O53CozzyRides live-map build. Host over HTTPS (Netlify, GitHub Pages, Cloudflare Pages). Tiles: CARTO/OpenStreetMap. Search: Nominatim. Routing: OSRM demo. Swap for Google Maps Platform, Mapbox or MapTiler keys before launch. Payments are simulated. -->
<title>O53CozzyRides – Premium Ride Comfort</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0f8;--card:#fff;--ink:#241338;--mut:#6d6483;--line:#e3dcee;--gold:#d9b572;--teal:#1b8486;--tealt:#fff;--hero:#241338;--herot:#f6ecd6;--red:#c43d52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150b24;--card:#221436;--ink:#f1eaf8;--mut:#a99bc2;--line:#35254f;--teal:#3ab5b6;--tealt:#0d2a2b;--hero:#2d1a47}}
:root[data-theme="dark"]{--bg:#150b24;--card:#221436;--ink:#f1eaf8;--mut:#a99bc2;--line:#35254f;--teal:#3ab5b6;--tealt:#0d2a2b;--hero:#2d1a47}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
.app{max-width:440px;margin:0 auto;padding:0 14px 96px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
header{background:var(--hero);color:var(--herot);margin:0 -14px 14px;padding:22px 18px 18px;border-radius:0 0 26px 26px}
header h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--gold);font-style:italic;font-family:Fraunces,Georgia,serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--card)}
.map svg{display:block;width:100%;height:auto}
.road{stroke:var(--line);stroke-width:9;fill:none}.park{fill:var(--line);opacity:.5}
label{display:block;font-weight:600;color:var(--mut);font-size:13px;margin-bottom:4px}
select,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.ride{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--card);width:100%;text-align:left;color:var(--ink);font:inherit}
.ride[aria-pressed=true]{border-color:var(--teal)}
.ride b{font-family:Fraunces,Georgia,serif;font-size:17px}.ride small{color:var(--mut);display:block}
.ico{width:44px;height:44px;border-radius:12px;background:var(--hero);color:var(--gold);display:grid;place-items:center;font-size:20px;flex:none}
.btn{background:var(--teal);color:var(--tealt);border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;width:100%;cursor:pointer;font-size:16px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sos{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pm[aria-pressed=true]{border-color:var(--teal)}.pm b{display:block}.pm small{color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--teal);transition:width .5s}
.pin{font-family:Fraunces,Georgia,serif;font-size:34px;letter-spacing:.2em;color:var(--gold);background:var(--hero);border-radius:12px;padding:6px 16px;display:inline-block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:440px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:8px 2px;cursor:pointer;font-size:12px}
.tabs button[aria-current=true]{color:var(--teal);font-weight:800}.tabs span{display:block;font-size:20px}
.stars button{background:none;border:0;font-size:32px;cursor:pointer;color:var(--line)}.stars button.on{color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--hero);color:var(--herot)}
.mut{color:var(--mut)}.big{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(20,10,35,.72);display:grid;place-items:center;padding:20px;z-index:9}
.modal .card{max-width:340px;text-align:center;margin:0}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:10px auto;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ok{color:var(--teal);font-weight:800}

body.lock{overflow:hidden}
#splash{position:fixed;inset:0;z-index:99;background:#1c1068;display:grid;place-items:center;transition:background .6s,opacity .6s;overflow:hidden}
#splash.k{background:#000}#splash.out{opacity:0;pointer-events:none}
#splash .lg{grid-area:1/1;width:min(78vw,380px);aspect-ratio:1;border-radius:50%;opacity:0;transform:scale(.7);transition:opacity .6s,transform .7s}
#splash .lg.in{opacity:1;transform:scale(1)}
#splash .lg.fly{animation:fly 1.2s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes fly{0%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-30vw,-40vh) scale(.1)}}
#splash .cr{grid-area:1/1;text-align:center;color:#fff;opacity:0;transition:opacity .7s;padding:20px}
#splash .cr.in{opacity:1}
#splash .cr h2{font-size:clamp(28px,8vw,38px);color:#3dff1c;letter-spacing:-.01em}
#splash .cr p{margin:2px 0 0;color:#cfd3dc;font-style:italic;font-family:Fraunces,Georgia,serif}
#splash .cr img{width:min(88vw,400px);display:block;margin:16px auto 0}
#skip{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:20px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-reduced-motion:reduce){#splash .lg,#splash .cr{transition:opacity .3s;transform:none}#splash .lg.fly{animation:none;opacity:0}}

:root{--hero:#2a16a0;--gold:#8dff1c;--herot:#fff;--teal:#2a9d00;--tealt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#1d0f6e;--teal:#8dff1c;--tealt:#10062e}}
:root[data-theme="dark"]{--hero:#1d0f6e;--teal:#8dff1c;--tealt:#10062e}
.mapx{position:relative;margin-bottom:6px;background:#120e3d}#mp{touch-action:none;cursor:grab}
.zb{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.zb button{width:46px;height:46px;border-radius:10px;border:3px solid transparent;font-size:26px;font-weight:800;cursor:pointer;color:#8dff1c;background:linear-gradient(#1a1070,#1a1070) padding-box,repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/10px 10px border-box}
.zb button+button{color:#1a1070;background:linear-gradient(#8dff1c,#8dff1c) padding-box,repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/10px 10px border-box}
.live{position:absolute;top:10px;right:10px;background:#8dff1c;color:#1a1070;font-weight:800;padding:6px 12px;border-radius:20px;font-size:13px}
.strip{font-size:12.5px;color:var(--mut);margin:0 0 12px;text-align:center}
.tc{color:#fff;border-radius:20px;padding:14px;margin-bottom:10px;border:4px solid transparent;background:linear-gradient(#2a16a0,#2a16a0) padding-box,repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/12px 12px border-box}
.av{width:62px;height:62px;border-radius:14px;background:#8dff1c;color:#1a1070;display:grid;place-items:center;font:800 28px Fraunces,Georgia,serif;flex:none}
.ck{height:10px;margin:12px 0;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/10px 10px}
.tiles{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}.tiles div{background:#1a0f66;border-radius:12px;padding:8px 10px}.tiles small{display:block;color:#cfc9f5}.tiles b{color:#8dff1c;font-size:16px}
.tc .btn.alt{color:#fff;border-color:#8dff1c}.tc .btn{background:#8dff1c;color:#1a1070}.tc .bar i{background:#8dff1c}.tc .bar{background:#1a0f66}
.foot{font-size:11.5px;color:var(--mut);text-align:center;font-weight:600;margin:8px 0}
.sgb{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.sc{position:absolute;left:10px;bottom:10px;color:#fff;font:700 11px Manrope,system-ui,sans-serif;text-shadow:0 0 3px #000;pointer-events:none}.sc i{display:block;height:5px;border:2px solid #fff;border-top:0;margin-bottom:2px}
.na{position:absolute;left:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#1a1070;color:#fff;border:2px solid #8dff1c;display:grid;place-items:center;font:800 11px Manrope,system-ui,sans-serif;pointer-events:none}
.mapx{isolation:isolate}#mp{width:100%;aspect-ratio:1/.9;background:#120e3d;cursor:grab}
.leaflet-container{font-family:Manrope,system-ui,sans-serif;background:#120e3d}.leaflet-tile-pane{filter:hue-rotate(25deg) saturate(1.6) brightness(1.2)}
.zb,.live,.na{z-index:1000}.leaflet-control-attribution{font-size:9px;background:rgba(18,14,61,.7)!important;color:#cfc9f5!important}.leaflet-control-attribution a{color:#8dff1c!important}
.leaflet-control-scale-line{background:rgba(18,14,61,.7);color:#fff;border-color:#fff}
.pw{position:relative}.pl{position:absolute;left:0;top:-60px;transform:translateX(-50%);white-space:nowrap;font:700 12px Manrope,system-ui,sans-serif;color:#fff;text-shadow:0 0 3px #0d0a2e,0 0 3px #0d0a2e,0 0 3px #0d0a2e}
.car{width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#2a16a0;border:3px solid #8dff1c;display:grid;place-items:center;font-size:14px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-marker-icon{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{will-change:transform;transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-tile-container,.leaflet-pane>svg path{pointer-events:none}
.leaflet-control-scale-line{border:2px solid #fff;border-top:0;padding:2px 5px;font-size:11px;white-space:nowrap;box-sizing:border-box;line-height:1.1}
.leaflet-control-attribution{margin:0;padding:0 5px}
.nt{position:absolute;left:10px;right:10px;top:52px;z-index:1001;background:rgba(18,14,61,.94);color:#fff;border:1px solid #8dff1c;border-radius:12px;padding:10px;font-size:12.5px}.nt a{color:#8dff1c}

function pm(){return `<div class="pay">${Object.entries(P).map(([k,p])=>`<button class="pm" data-a="pay" data-v="${k}" aria-pressed="${S.pay===k}"><b><span class="dot" style="background:${p.c}"></span>${p.n}</b><small>${p.s}</small></button>`).join("")}</div>`}
function ride(){
if(S.phase==="idle")return `<div class="chips" style="margin-bottom:10px">${[["K","Kuruman"],["P","Postmasburg"],["B","Both towns"]].map(t=>`<button class="chip" data-a="town" data-v="${t[0]}" aria-pressed="${S.town===t[0]}">${t[1]}</button>`).join("")}</div>`+map()+
`<div class="card"><div class="chips" style="margin-bottom:10px"><button class="chip" data-a="mode" data-v="drop" aria-pressed="${S.mode==="drop"}">🏁 Set drop-off</button><button class="chip" data-a="mode" data-v="pick" aria-pressed="${S.mode==="pick"}">📍 Set pickup</button></div><div class="row"><input id="ad" autocomplete="off" placeholder="Street address, e.g. 12 Voortrekker Street, Kuruman" value="${esc(S.q)}" style="flex:1"><button class="chip" data-a="find">Find</button></div><div id="sg">${S.res.map((r,i)=>`<button class="sgb" data-a="res" data-v="${i}">${r.label}</button>`).join("")}</div><div class="mut" style="margin-top:8px">Pickup: <b>${S.pick.label}</b></div>${S.dest?`<div class="mut">Drop-off: <b>${S.dest}</b></div>`:""}</div>`+
(S.dest?`<div class="chips" style="margin-bottom:12px"><button class="chip" data-a="when" data-v="now" aria-pressed="${S.when==="now"}">Ride now</button><button class="chip" data-a="when" data-v="later" aria-pressed="${S.when==="later"}">Schedule for later</button></div>`+(S.when==="later"?`<div class="card"><label for="sd">Pickup time</label><input id="sd" type="datetime-local"></div>`:"")+
Object.keys(T).map(k=>`<button class="ride" data-a="type" data-v="${k}" aria-pressed="${S.type===k}"><span class="ico">${T[k].i}</span><span style="flex:1"><b>${T[k].n}</b><small>${T[k].d} · ${T[k].eta} min away</small></span><b>${R(fare(k))}</b></button>`).join("")+
`<div class="card"><div class="row"><b>Pay with</b>${surge()>1?`<span class="mut">Peak pricing ×${surge()}</span>`:`<span class="mut">Standard pricing</span>`}</div><div style="height:8px"></div>${pm()}<div class="row" style="margin-top:12px"><input id="pr" placeholder="Promo code (try COZZY20)" value="${S.promoIn}" style="flex:1"><button class="chip" data-a="promo">Apply</button></div>${S.disc?`<div class="ok" style="margin-top:6px">20% off applied</div>`:""}</div><button class="btn" data-a="req">${S.when==="later"?"Schedule":"Request"} ${T[S.type].n} · ${R(fare(S.type))}</button>`:"");
if(S.phase==="search")return map()+`<div class="card" style="text-align:center"><div class="spin"></div><b>Finding your driver…</b><div class="mut">Matching the nearest top-rated ${T[S.type].n} driver</div></div>`;
const d=S.drv,dst=dd();
if(S.phase==="arriving"||S.phase==="ontrip"){const on=S.phase==="ontrip",eta=on?Math.max(1,Math.round(dst.m*(1-S.prog/100))):Math.max(1,Math.round(T[S.type].eta*(1-Math.min(1,S.prog*3.3/100))));
return map()+`<div class="tc"><div class="row" style="justify-content:flex-start;gap:12px"><span class="av">${d[0][0]}</span><div><div class="big" style="font-size:22px">${d[0]} 🇿🇦</div><div style="font-weight:600">★ ${d[1]} • ${d[2]} • Reg: ${S.reg||""}</div></div></div><div class="ck"></div><div class="tiles"><div><small>Fare</small><b>${R(fare(S.type))} ZAR</b></div><div><small>ETA</small><b>${eta} min</b></div><div><small>Distance</small><b>${dst.km.toFixed(1)} km</b></div></div>${on?"":`<div style="margin:12px 0 0;text-align:center">Tell the driver your PIN<br><span class="pin">${S.pin}</span></div>`}<div class="bar"><i style="width:${on?S.prog:Math.min(100,S.prog*3.3)}%"></i></div><div class="row"><button class="btn alt" data-a="msg">💬 Message</button><button class="btn" data-a="cancel">${on?"End demo":"Cancel Ride"}</button></div></div><p class="foot">${on?"ON TRIP":"DRIVER EN ROUTE"} • ${on?eta+" MIN TO DROP-OFF":"ARRIVING IN "+eta+" MIN"} • 053 COZY RIDES</p><button class="btn alt" data-a="share">${S.shared?"Trip shared ✓":"Share trip"}</button>`}
if(S.phase==="pay"){const f=fare(S.type);return `<div class="card" style="text-align:center"><div class="mut">You’ve arrived at ${dst.n}</div><div class="big">${R(f)}</div><div class="mut">${dst.km} km · ${dst.m} min · ${T[S.type].n}</div></div><div class="card"><b>Pay with</b><div style="height:8px"></div>${pm()}</div><button class="btn" data-a="doPay">Pay ${R(f)} with ${P[S.pay].n}</button>`}
if(S.phase==="rate")return `<div class="card" style="text-align:center"><h2>Paid. Thank you!</h2><div class="mut">How was your ride with ${d[0]}?</div><div class="stars">${[1,2,3,4,5].map(n=>`<button data-a="star" data-v="${n}" class="${S.rate>=n?"on":""}" aria-label="${n} stars">★</button>`).join("")}</div><div class="chips" style="justify-content:center">${[0,10,20,30].map(t=>`<button class="chip" data-a="tip" data-v="${t}" aria-pressed="${S.tip===t}">${t?"Tip R"+t:"No tip"}</button>`).join("")}</div></div><button class="btn" data-a="done" ${S.rate?"":"disabled"}>Submit and get receipt</button>`;
}
function trips(){return `<h2 style="margin-bottom:10px">Your trips</h2>`+(S.trips.length?S.trips.map(t=>`<div class="card"><div class="row"><b>${t.to}</b><b>${R(t.f)}</b></div><div class="mut">${t.t} · ${t.type} · ${t.pay} · ${t.drv}</div></div>`).join(""):`<div class="card mut">No trips yet. Your receipts will appear here after your first ride.</div>`)}
function wallet(){return `<h2 style="margin-bottom:10px">Payment methods</h2><div class="card">${pm()}<p class="mut" style="margin-bottom:0">Default: <b>${P[S.pay].n}</b>. Cash is never needed.</p></div><div class="card"><b>Rider receipts</b><div class="mut">Every payment sends a tax-invoice receipt to your email.</div></div>`}
function safety(){return `<h2 style="margin-bottom:10px">Safety</h2><div class="card"><b>Trusted contact</b><div class="row" style="margin-top:8px"><input id="ct" placeholder="Cell number" inputmode="tel" value="${S.contact}" style="flex:1"><button class="chip" data-a="saveC">Save</button></div>${S.saved?`<div class="ok">Contact saved. They’ll get your live trip link.</div>`:""}</div><div class="card"><b>Built-in protection</b><ul class="mut" style="padding-left:18px;margin:6px 0 0"><li>Ride PIN confirms you’re in the right car</li><li>Live trip sharing with anyone</li><li>Verified drivers and vehicle checks</li><li>Anonymous number masking for calls</li></ul></div><button class="btn sos" data-a="sos">${S.sos?"Alert sent — help is being notified":"SOS emergency"}</button>${S.sos?`<div class="card" style="margin-top:12px">Your location was sent to our safety team and trusted contact. In danger? Call SAPS <b>10111</b> or <b>112</b> from a cell phone.</div>`:""}`}
function render(){const v=document.getElementById("v");const a=document.activeElement&&document.activeElement.id;v.innerHTML={ride:ride,trips:trips,wallet:wallet,safety:safety}[S.tab]();
document.getElementById("nav").innerHTML=[["ride","🚖","Ride"],["trips","🧾","Trips"],["wallet","💳","Wallet"],["safety","🛡️","Safety"]].map(t=>`<button data-a="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="true"':""}><span>${t[1]}</span>${t[2]}</button>`).join("");
document.getElementById("m").innerHTML=S.busy?`<div class="modal"><div class="card"><div class="spin"></div><b>${P[S.pay].n}</b><div class="mut">${S.busy}</div></div></div>`:"";
mountMap();const el=a&&document.getElementById(a);if(el&&el.focus)el.focus()}
let tm;
function tick(){clearInterval(tm);tm=setInterval(()=>{if(S.phase==="arriving"){S.prog+=3;if(S.prog>=30){S.phase="ontrip";S.prog=0}}else if(S.phase==="ontrip"){S.prog+=4;if(S.prog>=100){S.prog=100;S.phase="pay";clearInterval(tm)}}else return;render()},700)}
document.addEventListener("input",e=>{if(e.target.id==="pr")S.promoIn=e.target.value;if(e.target.id==="ct")S.contact=e.target.value});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==="tab")S.tab=v;else if(a==="type")S.type=v;else if(a==="pay")S.pay=v;else if(a==="when")S.when=v;
else if(a==="promo"){S.disc=S.promoIn.trim().toUpperCase()==="COZZY20"?.2:0;if(!S.disc)alert("That code isn’t valid. Try COZZY20.")}
else if(a==="req"){if(S.when==="later"){alert("Ride scheduled. We’ll match a driver 10 minutes before pickup.");S.dest="";S.drop=null;S.rt=null;}else{S.phase="search";S.shared=false;setTimeout(()=>{S.drv=DR[Math.floor(Math.random()*4)];S.pin=String(1000+Math.floor(Math.random()*9000));S.pinN=Math.floor(10+Math.random()*80);S.reg="NC "+(100+Math.floor(Math.random()*899))+"-CZ";S.phase="arriving";S.prog=0;render();tick()},2200)}}
else if(a==="town"){S.town=v;if(v!=="B"){S.dest="";S.drop=null;S.rt=null;S.res=[];S.msg="";if(S.pickAuto)S.pick={lat:C[v].lat,lng:C[v].lng,label:C[v].n+" CBD (current location)"};if(LM)LM.setView([C[v].lat+.01,C[v].lng+.008],14)}else if(LM)LM.fitBounds([[-28.45,22.95],[-27.3,23.6]])}
else if(a==="mode")S.mode=v;
else if(a==="zin"||a==="zout"){if(LM)a==="zin"?LM.zoomIn():LM.zoomOut();return}
else if(a==="find"){doFind(document.getElementById("ad").value);return}
else if(a==="res"){const r=S.res[+v];S.res=[];S.q="";setPoint(S.mode,r,r.label);return}
else if(a==="msg"){alert("Chat with your driver opens here in the full app.");return}
else if(a==="share")S.shared=true;
else if(a==="cancel"){clearInterval(tm);S.phase="idle";S.prog=0}
else if(a==="doPay"){S.busy=P[S.pay].w;render();setTimeout(()=>{S.busy=null;S.phase="rate";render()},2200);return}
else if(a==="star")S.rate=+v;else if(a==="tip")S.tip=+v;
else if(a==="done"){const f=fare(S.type)+S.tip;S.trips.unshift({to:S.dest,f,type:T[S.type].n,pay:P[S.pay].n,drv:S.drv[0],t:new Date().toLocaleString("en-ZA",{dateStyle:"medium",timeStyle:"short"})});try{localStorage.setItem("o53trips",JSON.stringify(S.trips.slice(0,30)))}catch(x){}S.phase="idle";S.dest="";S.drop=null;S.rt=null;S.rate=0;S.tip=0;S.prog=0;S.tab="trips"}
else if(a==="saveC")S.saved=S.contact.trim()?"1":"";
else if(a==="sos")S.sos=true;
render()});
document.addEventListener("input",e=>{if(e.target.id==="ad")S.q=e.target.value});
document.addEventListener("keydown",e=>{if(e.target.id==="ad"&&e.key==="Enter")doFind(e.target.value)});
setTimeout(()=>{if(!S.tiles){S.noTiles=true;render()}},9000);
render();
</script></body></html>
